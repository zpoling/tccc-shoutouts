</style></head><body><div class="screen" data-layout="rounded"><main class="card" id="card"><h1 id="name">TCCC Shout-Outs</h1><p class="message" id="message">Loading shout-outs…</p><div class="credit" id="credit"></div></main><span id="counter"></span></div><script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyhK6FLQ4xgHAyroPLvGTEVXCrDqnAADU_eT-Bis2srPdiCoaQiyGJH1nOd2xuAqxfG4g/exec";

    // Defaults to 12s per slide and 60s sheet refresh; override slide speed with ?seconds=10 if needed
    const params = new URLSearchParams(window.location.search);
    const SLIDE_MS = Math.max(3, Number(params.get("seconds")) || 12) * 1000;
    const REFRESH_MS = 60000;
    const LAST_KEY = "tccc_last_shoutout";

    let shoutouts = [];
    let lastRawJson = "";
    let lastFetchTime = 0;
    let currentIndex = 0;
    let requestNumber = 0;

    const card = document.getElementById("card");
    const nameBox = document.getElementById("name");
    const messageBox = document.getElementById("message");
    const creditBox = document.getElementById("credit");
    const counterBox = document.getElementById("counter");

    function itemKey(item) {
      return item.name + "|" + item.message;
    }

    function getLastShown() {
      try {
        return localStorage.getItem(LAST_KEY) || "";
      } catch (e) {
        return "";
      }
    }

    function setLastShown(key) {
      try {
        localStorage.setItem(LAST_KEY, key);
      } catch (e) {}
    }

    function shuffle(list) {
      const copy = list.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const temp = copy[i];
        copy[i] = copy[j];
        copy[j] = temp;
      }

      // Avoid repeating the exact same shout-out first on playlist reloads or reshuffles
      const previous = getLastShown();
      if (copy.length > 1 && previous && itemKey(copy[0]) === previous) {
        const first = copy[0];
        copy[0] = copy[1];
        copy[1] = first;
      }

      return copy;
    }

    const screenBox = document.querySelector(".screen");
    const fonts = new Map([
      ["rounded", '"Trebuchet MS", Arial, sans-serif'],
      ["classic", 'Georgia, serif'],
      ["bold", 'Impact, "Arial Black", Arial, sans-serif']
    ]);

    function applyStyle(item) {
      const gold = String(item.layout || "").trim().toLowerCase() === "gold";
      screenBox.dataset.layout = gold ? "gold" : "rounded";
      const font = String(item.font || "").trim().toLowerCase();
      card.style.setProperty("--font", fonts.get(font) || fonts.get(gold ? "bold" : "rounded"));
    }

    function fitCard() {
      let size = screenBox.clientWidth * 0.062;
      card.style.fontSize = size + "px";
      while (card.scrollHeight > card.clientHeight && size > 1) {
        size = Math.floor(size * 0.95);
        card.style.fontSize = size + "px";
      }
      card.scrollTop = 0;
    }
    window.addEventListener("resize", fitCard);
    function showNotice(message) {
      nameBox.textContent = "TCCC Shout-Outs";
      messageBox.textContent = message;
      creditBox.textContent = "";
      counterBox.textContent = "";
      fitCard();
    }

    function showShoutout() {
      if (!shoutouts.length) {
        showNotice("Who made your day? Give them a shout-out!");
        return;
      }

      const item = shoutouts[currentIndex];
      applyStyle(item);
      setLastShown(itemKey(item));

      nameBox.textContent = item.name;
      messageBox.textContent = item.message;
      creditBox.textContent = item.credit ? "From: " + item.credit : "";
      counterBox.textContent = (currentIndex + 1) + " / " + shoutouts.length;

      fitCard();
    }

    async function refreshShoutouts() {
      const thisRequest = ++requestNumber;
      const controller = new AbortController();
      const timeout = setTimeout(function () {
        controller.abort();
      }, 30000);

      try {
        const url = SCRIPT_URL + "?json=1&t=" + Date.now();
        const response = await fetch(url, { signal: controller.signal });

        clearTimeout(timeout);
        if (thisRequest !== requestNumber) return;

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const items = await response.json();
        const nextItems = Array.isArray(items) ? items : [];
        const rawJson = JSON.stringify(nextItems);
        lastFetchTime = Date.now();

        // Keep playing uninterrupted unless the sheet data actually changed
        if (rawJson !== lastRawJson || !shoutouts.length) {
          lastRawJson = rawJson;
          shoutouts = shuffle(nextItems);
          currentIndex = 0;
          showShoutout();
        }
      } catch (err) {
        clearTimeout(timeout);
        if (thisRequest !== requestNumber) return;

        // If already displaying shout-outs on a dedicated TV, keep showing them through a brief blip
        if (!shoutouts.length) {
          lastRawJson = "";
          showNotice("Our shout-outs will be back shortly.");
        }
      }
    }

    setInterval(function () {
      if (shoutouts.length > 1) {
        currentIndex++;
        if (currentIndex >= shoutouts.length) {
          shoutouts = shuffle(shoutouts);
          currentIndex = 0;
        }
        showShoutout();
      }
    }, SLIDE_MS);

    setInterval(refreshShoutouts, REFRESH_MS);

    // Refresh immediately if OptiSigns un-hides a cached player tab after 60+ seconds
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible" && Date.now() - lastFetchTime >= REFRESH_MS) {
        refreshShoutouts();
      }
    });

    refreshShoutouts();
  </script>

</body>
</html>
